name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the port archive
        run: ./build-release.sh

      - name: Check the archive carries no game files
        run: |
          if python3 -c "
          import sys, zipfile
          bad = [n for n in zipfile.ZipFile('dist/blacksouls2.zip').namelist()
                 if any(k in n for k in ('rgss3a', '/Audio/', '/Graphics/', '/Fonts/', 'Game.ini'))]
          print('\n'.join(bad))
          sys.exit(1 if bad else 0)
          "; then
            echo "Clean: engine only."
          else
            echo "::error::Game files found in the archive, refusing to publish."
            exit 1
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/blacksouls2.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "PortMaster port of BLACK SOULS II, running on mkxp-z.

          This archive is the engine and launcher only. BLACK SOULS II is a paid title, so you supply your own copy of the game files; see the README inside the port folder for what to copy and where.

          Install by dropping the zip into PortMaster's autoinstall folder, or with:

              harbourmaster install <url of this asset>"

      - uses: actions/upload-artifact@v4
        with:
          name: blacksouls2-zip
          path: dist/blacksouls2.zip
